name: CI

on:
  # Build on pushes to release branches
  push:
    branches: [main]
  # Build on pull requests targeting release branches
  pull_request:
    branches: [main]
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    name: 'Build, lint & coverage: Node.js LTS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: npx ls-engines
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint -- --quiet
      - run: pnpm run coverage

  test:
    name: 'Test: Node.js ${{ matrix.node }}, ${{ matrix.platform }}'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the testing suite on every supported Node.js version, on ubuntu since it's the fastest CI runner:
        #   22.12.0 - the minimum supported version (must match the `engines` field in package.json)
        #   24      - the active LTS release
        #   26      - the latest/current release
        include:
          - os: ubuntu-latest
            platform: Ubuntu
            node: '22.12.0'
          - os: ubuntu-latest
            platform: Ubuntu
            node: '24'
          - os: ubuntu-latest
            platform: Ubuntu
            node: '26'
          # Additionally verify the active LTS release on the other major operating systems.
          - os: macos-latest
            platform: macOS
            node: '24'
          - os: windows-latest
            platform: Windows
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}
      - run: pnpm install
      - run: npx ls-engines
      - run: pnpm run build
      - run: pnpm test

  test-browser:
    name: 'Test: Chrome, Firefox, WebKit'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser -- --coverage
      - run: pnpm run build
      - run: pnpm run test:smoke:browser

  test-bun:
    name: 'Test: Bun'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - run: pnpm run test:bun
      - run: pnpm run build
      - run: pnpm run test:smoke:bun

  test-deno:
    name: 'Test: Deno'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:deno

  test-happy-dom:
    name: 'Test: happy-dom, Node.js LTS'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:happy-dom
      - run: pnpm run build
      - run: pnpm run test:smoke:happy-dom

  test-jsdom:
    name: 'Test: jsdom, Node.js LTS'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:jsdom
      - run: pnpm run build
      - run: pnpm run test:smoke:jsdom

  test-react-server:
    name: 'Test: React Server Components'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:react-server
      - run: pnpm run build
      - run: pnpm run test:smoke:react-server

  test-vercel-edge:
    name: 'Test: Vercel Edge'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:vercel-edge -- --coverage
      - run: pnpm run build
      - run: pnpm run test:smoke:vercel-edge

  test-workerd:
    name: 'Test: workerd'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workerd
      - run: pnpm run build
      - run: pnpm run test:smoke:workerd
